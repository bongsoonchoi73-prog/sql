  <entry key="save">
   INSERT
    INTO
       HOUSEPLANT
  VALUES
       (
       SEQ_PLANT_NO.NEXTVAL
       , ?
       , ?
         )
  
  </enrty>
  
  <enrty key="view">
    SELECT
    	 	  PLANT_NO
          , PLANT_NAME
          , PLANT_TYPE
     FROM
            HOUSRPLANT
    ORDER
       BY
    	    PLANT_NO DESC
 
